<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحه پیدا نشد | مهدی افراشته</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:light dark;font-family:Tahoma,Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0f12;color:#f2f3f5}
    main{width:min(92%,640px);padding:40px;border:1px solid #282d36;border-radius:24px;background:#13161b}
    small{color:#8c82ff;font-weight:700}
    h1{margin:12px 0;font-size:clamp(34px,8vw,60px)}
    p{color:#a1a6b0;line-height:1.9}
    a{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:12px;background:#f2f3f5;color:#0d0f12;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <small>404</small>
    <h1>این صفحه اینجا نیست.</h1>
    <p>ممکن است آدرس تغییر کرده باشد یا صفحه هنوز ساخته نشده باشد.</p>
    <a href="/">بازگشت به صفحه اصلی</a>
  </main>
</body>
</html>
